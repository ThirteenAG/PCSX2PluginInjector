name: GitHub Actions Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        platform: [Win64]
        buildtype: [Release]

    steps:
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Configure build
      shell: cmd
      run: |
        ./premake5.bat
    - name: Verify pinned upstream download and module build contract
      shell: pwsh
      run: |
        python tools/stock-pcsx2/update-download-links.py --check
        if ($LASTEXITCODE -ne 0) { throw 'Pinned upstream download is stale.' }
        foreach ($test in @('tools/stock-pcsx2/test_packaging.py', 'external/ps2sdk/plugins/test_build.py', 'external/ps2sdk/plugins/test_sync.py')) {
          python $test
          if ($LASTEXITCODE -ne 0) { throw "Verification failed: $test" }
        }
    - name: Build
      shell: cmd
      run: |
        msbuild -m build/PCSX2PluginInjector.sln /property:Configuration=${{matrix.buildtype}} /property:Platform=${{matrix.platform}}
    - name: Verify rebuilt guest modules
      shell: pwsh
      run: |
        msbuild tests/GuestModuleLoaderTests.vcxproj /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal
        if ($LASTEXITCODE -ne 0) { throw 'Guest loader test build failed.' }
        $modules = @(Get-ChildItem data/PLUGINS -Recurse -File -Filter '*.elf' | ForEach-Object FullName)
        if ($modules.Count -ne 6) { throw 'Expected three probes and three migrated demos.' }
        & build/tests/GuestModuleLoaderTests.exe --modules @modules
        if ($LASTEXITCODE -ne 0) { throw 'Rebuilt guest module validation failed.' }
    - name: Download Ultimate ASI Loader x64
      uses: robinraju/release-downloader@v1.13
      with:
        repository: "ThirteenAG/Ultimate-ASI-Loader"
        tag: "x64-latest"
        fileName: "version-x64.zip"
    - name: Unpack dependencies
      run: |
          7z x version-x64.zip -odata/ -y
          del version-x64.zip
          del data\version-x64.SHA512
    - name: Pack binaries
      run: |
        ./release.bat
    - name: Get release info
      if: |
        github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.repository == 'ThirteenAG/PCSX2PluginInjector'
      id: release_info
      uses: cardinalby/git-get-release-action@master
      env:
       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: latest
    - name: Bind original PCSX2 download in release notes
      if: |
        github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.repository == 'ThirteenAG/PCSX2PluginInjector'
      env:
        EXISTING_RELEASE_BODY: ${{ steps.release_info.outputs.body }}
      run: python tools/stock-pcsx2/release-notes.py docs/stock-pcsx2-download.md build/release-notes.md
    - name: Upload Release
      if: |
        github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.repository == 'ThirteenAG/PCSX2PluginInjector'
      uses: ncipollo/release-action@v1.21.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        name: ${{ steps.release_info.outputs.name }}
        bodyFile: build/release-notes.md
        tag: ${{ steps.release_info.outputs.tag_name }}
        artifacts: PCSX2PluginInjector.zip,PCSX2PluginInjectorDemo.zip
